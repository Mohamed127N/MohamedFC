  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.45); border-radius: 999px; }

    /* Geometric Card Frames */
    .card-standard {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 60%, #1e293b 100%);
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.6);
    }
    .card-pro {
      background: linear-gradient(145deg, #064e3b 0%, #022c22 45%, #0891b2 100%);
      border: 1.5px solid #34d399;
      box-shadow: 0 10px 26px -5px rgba(16, 185, 129, 0.45);
    }
    .card-icon {
      background: linear-gradient(145deg, #78350f 0%, #451a03 45%, #d97706 100%);
      border: 1.5px solid #fbbf24;
      box-shadow: 0 10px 28px -5px rgba(245, 158, 11, 0.5);
    }
    .light .card-standard {
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 65%, #e2e8f0 100%);
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
    }

    /* Tactical Pitch Styling */
    .tactical-pitch {
      background: repeating-linear-gradient(
        0deg,
        #0a4431 0px,
        #0a4431 36px,
        #0d523b 36px,
        #0d523b 72px
      );
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.65), 0 18px 40px -10px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes goalFlash {
      0% { transform: scale(0.7); opacity: 0; }
      20% { transform: scale(1.1); opacity: 1; }
      85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    @keyframes slideUp {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-goal-banner { animation: goalFlash 3.2s ease-in-out forwards; }
    .pitch-token { transition: transform 0.12s ease, box-shadow 0.15s ease; }
    .pitch-token.dragging { z-index: 50; transform: translate(-50%, -50%) scale(1.14) !important; box-shadow: 0 0 25px rgba(16, 185, 129, 0.9); }

    /* Clip paths for sport badges */
    .shield-clip { clip-path: polygon(50% 0%, 95% 18%, 88% 76%, 50% 100%, 12% 76%, 5% 18%); }
    .hex-clip { clip-path: polygon(25% 3%, 75% 3%, 98% 50%, 75% 97%, 25% 97%, 2% 50%); }
  </style>
</head>

// Deterministic PRNG (Mulberry32)
function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Generate Position-Specific Attributes
function generateAttributesForPosition(pos, ovr, rng) {
  const jitter = () => Math.round((rng() - 0.5) * 6);
  const clamp = (v) => Math.max(45, Math.min(99, v));
  if (pos === 'GK') {
    return {
      reflexes: clamp(ovr + 2 + jitter()),
      handling: clamp(ovr + jitter()),
      positioning: clamp(ovr + 1 + jitter()),
      diving: clamp(ovr + 2 + jitter()),
      kicking: clamp(ovr - 4 + jitter()),
      speed: clamp(52 + jitter())
    };
  }
  const base = {
    pace: clamp(ovr - 4 + jitter()),
    shooting: clamp(ovr - 8 + jitter()),
    passing: clamp(ovr - 5 + jitter()),
    dribbling: clamp(ovr - 5 + jitter()),
    defending: clamp(ovr - 12 + jitter()),
    physical: clamp(ovr - 5 + jitter()),
    finishing: clamp(ovr - 8 + jitter()),
    positioning: clamp(ovr - 4 + jitter()),
    tackling: clamp(ovr - 10 + jitter()),
    marking: clamp(ovr - 10 + jitter()),
    interceptions: clamp(ovr - 10 + jitter()),
    vision: clamp(ovr - 6 + jitter()),
    ball_control: clamp(ovr - 3 + jitter()),
    crossing: clamp(ovr - 8 + jitter()),
    stamina: clamp(ovr - 2 + jitter()),
    agility: clamp(ovr - 4 + jitter()),
    heading: clamp(ovr - 8 + jitter())
  };
  if (pos === 'CB') {
    base.defending = clamp(ovr + 2 + jitter());
    base.tackling = clamp(ovr + 2 + jitter());
    base.marking = clamp(ovr + 2 + jitter());
    base.interceptions = clamp(ovr + 1 + jitter());
    base.physical = clamp(ovr + 3 + jitter());
    base.heading = clamp(ovr + 2 + jitter());
    base.shooting = clamp(52 + jitter());
  } else if (pos === 'RB' || pos === 'LB') {
    base.pace = clamp(ovr + 3 + jitter());
    base.stamina = clamp(ovr + 3 + jitter());
    base.crossing = clamp(ovr + 1 + jitter());
    base.tackling = clamp(ovr + jitter());
    base.defending = clamp(ovr - 1 + jitter());
  } else if (pos === 'CM') {
    base.passing = clamp(ovr + 3 + jitter());
    base.vision = clamp(ovr + 3 + jitter());
    base.ball_control = clamp(ovr + 2 + jitter());
    base.stamina = clamp(ovr + 2 + jitter());
    base.dribbling = clamp(ovr + 1 + jitter());
  } else if (pos === 'RW' || pos === 'LW') {
    base.pace = clamp(ovr + 4 + jitter());
    base.dribbling = clamp(ovr + 3 + jitter());
    base.agility = clamp(ovr + 3 + jitter());
    base.crossing = clamp(ovr + 1 + jitter());
    base.finishing = clamp(ovr + jitter());
  } else if (pos === 'ST') {
    base.finishing = clamp(ovr + 3 + jitter());
    base.shooting = clamp(ovr + 3 + jitter());
    base.positioning = clamp(ovr + 3 + jitter());
    base.heading = clamp(ovr + 1 + jitter());
    base.physical = clamp(ovr + 1 + jitter());
  }
  return base;
}

// Unique Seeded SVG Digital Sports Portrait Generator (1000 distinct portraits!)
const SKIN_TONES = ['#f8d5c2', '#f1c2a5', '#e0ac8b', '#c68663', '#a56846', '#7d4a30', '#593320', '#3d2215'];
const HAIR_COLORS = ['#111827', '#1f2937', '#3b2314', '#5c381e', '#78350f', '#b45309', '#d97706', '#9ca3af', '#e5e7eb'];

function buildPortraitSVG(player, size = 64) {
  const seed = hashStr(`${player.player_id}_${player.en_name}_${player.nat}`);
  const rng = mulberry32(seed);

  // Pick realistic skin tone by nationality + deterministic variance
  let skinIdx = Math.floor(rng() * SKIN_TONES.length);
  if (['مصر', 'المغرب', 'السعودية', 'تونس', 'الجزائر'].includes(player.nat)) {
    skinIdx = 2 + Math.floor(rng() * 3);
  } else if (['نيجيريا', 'السنغال', 'الكاميرون', 'ساحل العاج', 'ليبيريا'].includes(player.nat)) {
    skinIdx = 5 + Math.floor(rng() * 3);

// Pricing Formula: Base 100 = 2x reference 99 price; 101 = 2x 100; 102 = 2x 101; 103 = 2x 102
function calculateCardPrice(ovr, editionType) {
  const REF_99_PRICE = 24.0; // €24.0M reference for 99 OVR
  if (ovr <= 99) {
    if (ovr >= 95) return Number((12 + (ovr - 95) * 3).toFixed(1));
    if (ovr >= 90) return Number((6.5 + (ovr - 90) * 1.1).toFixed(1));
    if (ovr >= 85) return Number((3.0 + (ovr - 85) * 0.7).toFixed(1));
    if (ovr >= 80) return Number((1.2 + (ovr - 80) * 0.35).toFixed(1));
    return Number((0.4 + Math.max(0, ovr - 70) * 0.08).toFixed(1));
  }
  if (ovr === 100) return REF_99_PRICE * 2;       // 48.0M
  if (ovr === 101) return REF_99_PRICE * 4;       // 96.0M
  if (ovr === 102) return REF_99_PRICE * 8;       // 192.0M
  if (ovr === 103) return REF_99_PRICE * 16;      // 384.0M
  return REF_99_PRICE * 16;
}

  const usedNames = new Set();

  for (const s of VERIFIED_STARS) {

  const usedPids = new Set();
  const roster = [];
  const lineup = [];
  const bench = [];
  const form433 = FORMATIONS['4-3-3'];

  starterSpecs.forEach((spec, idx) => {
    // Pick an authentic non-retired player matching position & rating
    let candidate = PLAYER_CATALOG.find(p =>
      !p.is_retired &&
      !usedPids.has(p.player_id) &&
      p.primary_position === spec.pos &&
      Math.abs(p.editions[0].base_rating - spec.targetOvr) <= 3
    );
    if (!candidate) {
      candidate = PLAYER_CATALOG.find(p => !p.is_retired && !usedPids.has(p.player_id) && p.primary_position === spec.pos);
    }
    usedPids.add(candidate.player_id);
    const stdCard = candidate.editions[0];
    const instId = `inst_${candidate.player_id}_${idx + 1}`;
    roster.push({
      card_instance_id: instId,
      player_id: candidate.player_id,
      card_id: stdCard.card_id,
      edition: stdCard.edition,
      base_rating: stdCard.base_rating,
      goal_bonus: 0,      // Max +4 (+1 every 5 goals)
      training_bonus: 0,  // Max +10
      goals_scored: 0,
      assists: 0,
      matches_played: 0,
      acquired_at: new Date().toISOString()
    });

    if (idx < 11) {
      lineup.push({
        slot_idx: idx,
        instance_id: instId,
        x: form433[idx].x,
        y: form433[idx].y,
        expected_pos: form433[idx].pos

      bench.push(instId);
    }
  });

  GAME_STATE.roster = roster;
  GAME_STATE.lineup = lineup;
  GAME_STATE.bench = bench;
}

// IndexedDB + LocalStorage Persistence Layer
const DB_NAME = 'UFM_V2_DB';
const STORE_NAME = 'saves';

function saveToIndexedDB(stateObj) {
  try {
    localStorage.setItem('UFM_V2_BACKUP', JSON.stringify(stateObj));
  } catch (e) {}
  if (!window.indexedDB) return;
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      db.createObjectStore(STORE_NAME);
    }
  };
  req.onsuccess = (e) => {
    try {
      const db = e.target.result;
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(stateObj, 'primary_save');
    } catch (err) {}
  };
}

function loadSavedState(callback) {
  let resolved = false;
  const finish = (data) => {
    if (resolved) return;
    resolved = true;
    if (data && Array.isArray(data.roster) && data.roster.length > 0) {
      GAME_STATE = { ...GAME_STATE, ...data };
    } else {
      buildStarterSquad();
      saveToIndexedDB(GAME_STATE);
    }
    callback();
  };

  if (window.indexedDB) {
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = (e) => {
        const db = e.target.result;
        const tx = db.transaction(STORE_NAME, 'readonly');
        const getReq = tx.objectStore(STORE_NAME).get('primary_save');
        getReq.onsuccess = () => {
          if (getReq.result) finish(getReq.result);
          else {
            const ls = localStorage.getItem('UFM_V2_BACKUP');
            finish(ls ? JSON.parse(ls) : null);
          }
        };
        getReq.onerror = () => {
          const ls = localStorage.getItem('UFM_V2_BACKUP');
          finish(ls ? JSON.parse(ls) : null);
        };
      };
      req.onerror = () => {
        const ls = localStorage.getItem('UFM_V2_BACKUP');
        finish(ls ? JSON.parse(ls) : null);
      };
    } catch (err) {
      const ls = localStorage.getItem('UFM_V2_BACKUP');
      finish(ls ? JSON.parse(ls) : null);
    }
  } else {
    const ls = localStorage.getItem('UFM_V2_BACKUP');
    finish(ls ? JSON.parse(ls) : null);
  }
}

function persistState() {

// ============================================================================
// 3. DUAL OVR & TACTICAL POSITIONAL PENALTY ENGINE
// ============================================================================
function getInstanceEffectiveOVR(inst) {
  if (!inst) return 0;
  const maxCap = inst.base_rating === 103 ? 117 : (inst.base_rating + 14);
  return Math.min(maxCap, inst.base_rating + (inst.goal_bonus || 0) + (inst.training_bonus || 0));
}

function getInstanceFullData(instId) {
  const inst = GAME_STATE.roster.find(r => r.card_instance_id === instId);
  if (!inst) return null;
  const player = PLAYER_BY_ID.get(inst.player_id);
  const card = CARD_BY_ID.get(inst.card_id);
  if (!player || !card) return null;
  return {
    inst,
    player,
    card,
    ovr: getInstanceEffectiveOVR(inst)
  };
}

// Infer tactical zone position from (x, y) pitch coordinates (0..100, y=90 is own GK, y=15 is opp ST)
function inferPitchZonePosition(x, y) {
  if (y >= 82) return 'GK';
  if (y >= 64) {
    if (x >= 72) return 'RB';
    if (x <= 28) return 'LB';
    return 'CB';
  }
  if (y >= 40) {
    if (x >= 76) return 'RW';
    if (x <= 24) return 'LW';
    return 'CM';
  }
  if (x >= 68) return 'RW';
  if (x <= 32) return 'LW';
  return 'ST';
}

// Graduated Positional Fit Multiplier (1.0 = natural, 0.90 = adjacent, 0.68 = wrong zone, 0.45 = non-GK in GK)
function getPositionalFit(player, zonePos) {
  if (zonePos === 'GK') {
    return player.primary_position === 'GK' ? 1.0 : 0.42;
  }
  if (player.primary_position === 'GK') {
    return 0.45; // GK playing outfield
  }
  if (player.primary_position === zonePos) return 1.0;
  if (player.secondary_positions && player.secondary_positions.includes(zonePos)) return 0.96;
  if (ADJACENT_POSITIONS[player.primary_position]?.includes(zonePos)) return 0.89;
  return 0.72; // Far out of position
}

// 1. Squad OVR: Mean of all unique owned players in Club Roster (no duplicates, no division by zero)
function calculateSquadOVR() {
  if (!GAME_STATE.roster || GAME_STATE.roster.length === 0) return 0.0;
  const seenIds = new Set();
  let sum = 0;
  let count = 0;
  for (const inst of GAME_STATE.roster) {
    if (seenIds.has(inst.card_instance_id)) continue;
    seenIds.add(inst.card_instance_id);
    sum += getInstanceEffectiveOVR(inst);
    count++;
  }
  return count === 0 ? 0.0 : Number((sum / count).toFixed(1));
}

// 2. Match OVR: Mean of the 11 starting players on the pitch (Bench NEVER inflates Match OVR)
function calculateMatchOVR() {
  if (!GAME_STATE.lineup || GAME_STATE.lineup.length === 0) return 0.0;
  const seenIds = new Set();
  let sum = 0;
  let count = 0;
  for (const slot of GAME_STATE.lineup) {
    if (!slot.instance_id || seenIds.has(slot.instance_id)) continue;
    const data = getInstanceFullData(slot.instance_id);
    if (!data) continue;
    seenIds.add(slot.instance_id);
    sum += data.ovr;
    count++;
  }
  return count === 0 ? 0.0 : Number((sum / count).toFixed(1));
}

// Compute Detailed Line Strengths & Effective Tactical Rating for Any Team (User or Opponent)
function evaluateTeamTacticalProfile(startersList, playStyle, coaches = []) {
  // startersList: [{ player, card, ovr, zonePos }]
  const coachMap = { DEFENCE: 1, ATTACK: 1, MIDFIELD: 1, GOALKEEPER: 1 };
  coaches.forEach(c => { coachMap[c.specialty] = c.level || 1; });

  let attSum = 0, attCount = 0;
  let midSum = 0, midCount = 0;
  let defSum = 0, defCount = 0;
  let gkScore = 50;
  let fitSum = 0;
  let hasRealGK = false;
  const outOfPosList = [];

  startersList.forEach(item => {
    const { player, card, ovr, zonePos } = item;
    const fit = getPositionalFit(player, zonePos);
    fitSum += fit;
    if (fit < 0.92) {
      outOfPosList.push({ name: player.display_name, realPos: player.primary_position, zonePos, fit });
    }

    const attrs = card.attributes;
    const effOvr = ovr * fit;

    if (zonePos === 'GK') {
      hasRealGK = (player.primary_position === 'GK');
      const gkAttr = attrs.reflexes ? (attrs.reflexes + attrs.positioning + attrs.handling + attrs.diving) / 4 : effOvr;
      gkScore = ((effOvr * 0.55 + gkAttr * 0.45) * (1 + (coachMap.GOALKEEPER - 1) * 0.018));
    } else if (POS_LINE[zonePos] === 'DEF') {
      const defAttr = attrs.tackling ? (attrs.tackling + attrs.marking + attrs.interceptions + attrs.physical) / 4 : effOvr;
      defSum += (effOvr * 0.55 + defAttr * 0.45);
      defCount++;
    } else if (POS_LINE[zonePos] === 'MID') {
      const midAttr = attrs.passing ? (attrs.passing + attrs.vision + attrs.ball_control + attrs.stamina) / 4 : effOvr;
      midSum += (effOvr * 0.55 + midAttr * 0.45);
      midCount++;
    } else {
      const attAttr = attrs.finishing ? (attrs.finishing + attrs.pace + attrs.dribbling + attrs.positioning) / 4 : effOvr;
      attSum += (effOvr * 0.55 + attAttr * 0.45);
      attCount++;
    }
  });

  const coachDefMult = 1 + (coachMap.DEFENCE - 1) * 0.018;
  const coachAttMult = 1 + (coachMap.ATTACK - 1) * 0.018;
  const coachMidMult = 1 + (coachMap.MIDFIELD - 1) * 0.018;

  // PlayStyle Modifiers (Attacking leaves spaces behind fullbacks; Defensive compacts box)
  let styleAttMod = 1.0, styleDefMod = 1.0, styleMidMod = 1.0, counterVulnerability = 1.0;
  if (playStyle === 'attacking') {
    styleAttMod = 1.09;
    styleMidMod = 1.03;
    styleDefMod = 0.89;
    counterVulnerability = 1.24; // Exposed flanks & space behind high defensive line
  } else if (playStyle === 'defensive') {
    styleAttMod = 0.88;
    styleMidMod = 0.98;
    styleDefMod = 1.11;
    counterVulnerability = 0.82;
  }

  const attackStrength = Number(((attCount ? attSum / attCount : 65) * coachAttMult * styleAttMod).toFixed(1));
  const midfieldStrength = Number(((midCount ? midSum / midCount : 65) * coachMidMult * styleMidMod).toFixed(1));
  const defenseStrength = Number(((defCount ? defSum / defCount : 65) * coachDefMult * styleDefMod).toFixed(1));
  const goalkeeperStrength = Number(gkScore.toFixed(1));
  const avgFit = startersList.length ? fitSum / startersList.length : 0.7;

  // Channel-level ratings for 1v1 Tactical Matchups
  const leftWing = startersList.find(s => s.zonePos === 'LW') || startersList.find(s => s.zonePos === 'LB');
  const rightWing = startersList.find(s => s.zonePos === 'RW') || startersList.find(s => s.zonePos === 'RB');
  const leftBack = startersList.find(s => s.zonePos === 'LB') || startersList.find(s => s.zonePos === 'CB');
  const rightBack = startersList.find(s => s.zonePos === 'RB') || startersList.find(s => s.zonePos === 'CB');
  const striker = startersList.find(s => s.zonePos === 'ST') || leftWing || rightWing;

  const getChannelVal = (item, keys) => {
    if (!item) return 70;
    const fit = getPositionalFit(item.player, item.zonePos);
    const a = item.card.attributes;
    const vals = keys.map(k => a[k] || item.ovr);
    return (vals.reduce((x, y) => x + y, 0) / vals.length) * fit;
  };

  return {
    attackStrength,
    midfieldStrength,
    defenseStrength,
    goalkeeperStrength,
    avgFit: Number((avgFit * 100).toFixed(0)),
    hasRealGK,
    outOfPosList,
    counterVulnerability,
    channels: {
      rwThreat: getChannelVal(rightWing, ['pace', 'dribbling', 'crossing']),
      lwThreat: getChannelVal(leftWing, ['pace', 'dribbling', 'crossing']),
      stThreat: getChannelVal(striker, ['finishing', 'positioning', 'shooting']),
      rbDefend: getChannelVal(rightBack, ['pace', 'tackling', 'positioning']) * styleDefMod * coachDefMult,
      lbDefend: getChannelVal(leftBack, ['pace', 'tackling', 'positioning']) * styleDefMod * coachDefMult,
    },
    effectiveOverall: Number((((attackStrength + midfieldStrength + defenseStrength + goalkeeperStrength) / 4)).toFixed(1))
  };
}

// ============================================================================
// 4. PRE-MATCH OPPONENT GENERATOR & TACTICAL INTELLIGENCE ENGINE
// ============================================================================
function generateOpponentClub(forceTier = null) {
  const userMatchOVR = calculateMatchOVR() || 81.5;
  const tiers = ['stronger', 'equal', 'weaker'];
  // Distribute across 3 encounter tiers naturally
  const chosenTier = forceTier || tiers[(GAME_STATE.matchHistory.length + Math.floor(Math.random() * 3)) % 3];

  let targetOVR = userMatchOVR;
  let tierLabel = 'متكافئ القوة (Equal OVR)';
  if (chosenTier === 'stronger') {
    targetOVR = Math.min(102, userMatchOVR + 14 + Math.round(Math.random() * 2));
    tierLabel = 'خصم نخبة أقوى (~+15 OVR)';
  } else if (chosenTier === 'weaker') {
    targetOVR = Math.max(72, userMatchOVR - 14 - Math.round(Math.random() * 2));
    tierLabel = 'خصم أقل تصنيفاً (~-15 OVR)';
  }

  // Pick a real club matching target tier
  const sortedClubs = [...REAL_CLUBS].sort((a, b) => Math.abs(a.tier - targetOVR) - Math.abs(b.tier - targetOVR));
  const club = sortedClubs[Math.floor(Math.random() * Math.min(5, sortedClubs.length))];

  const formKeys = Object.keys(FORMATIONS);
  const formName = formKeys[Math.floor(Math.random() * formKeys.length)];
  const formSlots = FORMATIONS[formName];
  const oppStyles = ['attacking', 'balanced', 'defensive'];
  const oppPlayStyle = oppStyles[Math.floor(Math.random() * oppStyles.length)];

  const usedPlayerIds = new Set();
  const starters = [];
  const bench = [];

  // Select 11 real players in valid positions matching targetOVR
  formSlots.forEach((slot, idx) => {
    const candidates = PLAYER_CATALOG.filter(p => !usedPlayerIds.has(p.player_id) && p.primary_position === slot.pos);
    // Pick player + edition closest to targetOVR
    let bestPick = null;
    let bestDiff = 999;

    for (let i = 0; i < 40; i++) {
      const p = candidates[Math.floor(Math.random() * candidates.length)];
      if (!p) continue;
      for (const ed of p.editions) {
        const diff = Math.abs(ed.base_rating - targetOVR);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestPick = { player: p, card: ed, ovr: ed.base_rating };
        }
      }
    }
    if (!bestPick) {
      const fallback = candidates[0];
      bestPick = { player: fallback, card: fallback.editions[0], ovr: fallback.editions[0].base_rating };
    }
    usedPlayerIds.add(bestPick.player.player_id);
    starters.push({
      slot_idx: idx,
      player_id: bestPick.player.player_id,
      card_id: bestPick.card.card_id,
      ovr: bestPick.ovr,
      x: slot.x,
      y: slot.y,
      zonePos: slot.pos
    });
  });

  // 5 Bench players
  ['GK', 'CB', 'CM', 'RW', 'ST'].forEach(bPos => {
    const p = PLAYER_CATALOG.find(pl => !usedPlayerIds.has(pl.player_id) && pl.primary_position === bPos);
    if (p) {
      usedPlayerIds.add(p.player_id);
      bench.push({ player_id: p.player_id, card_id: p.editions[0].card_id, ovr: p.editions[0].base_rating, pos: bPos });
    }
  });

  const oppMatchOVR = Number((starters.reduce((s, x) => s + x.ovr, 0) / starters.length).toFixed(1));
  const oppSquadOVR = Number((([...starters, ...bench].reduce((s, x) => s + x.ovr, 0)) / (starters.length + bench.length)).toFixed(1));

  // Top 3 Danger Men
  const dangerMen = [...starters]
    .filter(s => s.zonePos !== 'GK')
    .sort((a, b) => b.ovr - a.ovr)
    .slice(0, 3);

  GAME_STATE.currentOpponent = {
    id: `opp_${Date.now()}`,
    club,
    tier: chosenTier,
    tierLabel,
    formation: formName,
    playStyle: oppPlayStyle,
    matchOVR: oppMatchOVR,
    squadOVR: oppSquadOVR,
    starters,
    bench,
    dangerMen,
    locked: true
  };
  persistState();
  return GAME_STATE.currentOpponent;
}

// Tactical Intelligence Analyzer (Compare User vs Locked Opponent)
function analyzePreMatchIntelligence(opp) {
  const userStarters = GAME_STATE.lineup.map(slot => {
    const d = getInstanceFullData(slot.instance_id);
    const zonePos = inferPitchZonePosition(slot.x, slot.y);
    return { ...d, zonePos, x: slot.x, y: slot.y };
  }).filter(x => x && x.player);

  const oppStarters = opp.starters.map(s => ({
    player: PLAYER_BY_ID.get(s.player_id),
    card: CARD_BY_ID.get(s.card_id),
    ovr: s.ovr,
    zonePos: s.zonePos
  }));

  const userProfile = evaluateTeamTacticalProfile(userStarters, GAME_STATE.playStyle, GAME_STATE.coaches);
  const oppProfile = evaluateTeamTacticalProfile(oppStarters, opp.playStyle, []);

  // Line Advantages
  const attAdv = Number((userProfile.attackStrength - oppProfile.defenseStrength).toFixed(1));
  const midAdv = Number((userProfile.midfieldStrength - oppProfile.midfieldStrength).toFixed(1));
  const defAdv = Number((userProfile.defenseStrength - oppProfile.attackStrength).toFixed(1));
  const gkAdv = Number((userProfile.goalkeeperStrength - oppProfile.goalkeeperStrength).toFixed(1));

  // 1v1 Key Matchups
  const matchups = [
    {
      label: 'جناحك الأيمن (RW) ضد ظهير الخصم الأيسر (LB)',
      diff: Number((userProfile.channels.rwThreat - oppProfile.channels.lbDefend).toFixed(1)),
      note: userProfile.channels.rwThreat > oppProfile.channels.lbDefend ? 'أفضلية سرعة ومراوغة على الطرف الأيمن' : 'الخصم يغلق الجبهة اليسرى بقوة'
    },
    {
      label: 'جناحك الأيسر (LW) ضد ظهير الخصم الأيمن (RB)',
      diff: Number((userProfile.channels.lwThreat - oppProfile.channels.rbDefend).toFixed(1)),
      note: userProfile.channels.lwThreat > oppProfile.channels.rbDefend ? 'مساحات واعدة للاختراق من اليسار' : 'رقابة دفاعية صلبة أمام جناحك الأيسر'
    },
    {
      label: 'أجنحة الخصم الخطيرة ضد أظهرة فريقك (RB/LB)',
      diff: Number((((userProfile.channels.rbDefend + userProfile.channels.lbDefend) / 2) - ((oppProfile.channels.rwThreat + oppProfile.channels.lwThreat) / 2)).toFixed(1)),
      note: (GAME_STATE.playStyle === 'attacking' && (oppProfile.channels.rwThreat > 84 || oppProfile.channels.lwThreat > 84))
        ? 'تحذير: أسلوبك الهجومي يترك مساحات خلف الأظهرة أمام أجنحة الخصم السريعة!'
        : 'تغطية الأطراف الدفاعية متوازنة نسبياً'
    }
  ];

  // Style Compatibility Explanation
  let styleVerdict = '';
  if (GAME_STATE.playStyle === 'attacking' && oppProfile.attackStrength >= 85) {
    styleVerdict = 'خصمك يمتلك خط هجوم سريع وخطير: أسلوبك الهجومي قد يترك مساحات مكشوفة خلف المدافعين للمرتدات.';
  } else if (GAME_STATE.playStyle === 'defensive' && oppProfile.attackStrength >= 85) {
    styleVerdict = 'الأسلوب الدفاعي يضيق المساحات أمام مهاجمي الخصم ويحد من خطورة مرتداتهم.';
  } else if (GAME_STATE.playStyle === 'attacking' && oppProfile.defenseStrength < 80) {
    styleVerdict = 'الضغط الهجومي العالي مثالي لاختراق دفاع الخصم المتواضع وصناعة فرص غزيرة.';
  } else {
    styleVerdict = 'الأسلوب المتوازن يحافظ على الترابط بين الوسط والدفاع ويمنع انكشاف الخطوط.';
  }

  // Tactical Warnings (Max 2 concise warnings)
  const warnings = [];
  if (!userProfile.hasRealGK) {
    warnings.push('خطر حرج: لا يوجد حارس مرمى حقيقي في مركز GK!');
  } else if (userProfile.outOfPosList.length > 0) {
    const first = userProfile.outOfPosList[0];
    warnings.push(`تنبيه تمركز: ${first.name} (${first.realPos}) يلعب في مركز ${first.zonePos} بكفاءة منخفضة.`);
  }
  if (GAME_STATE.playStyle === 'attacking' && opp.playStyle === 'attacking') {
    warnings.push('مواجهة مفتوحة: كلا الفريقين يلعبان بأسلوب هجومي مما يرفع احتمالية المرتدات السريعة.');
  }

  // Approximate Win / Draw / Loss Probabilities (Never 100% guaranteed)
  const ratingGap = (userProfile.effectiveOverall - oppProfile.effectiveOverall);
  const rawWin = 38 + ratingGap * 2.1;
  const winProb = Math.max(12, Math.min(78, Math.round(rawWin)));
  const drawProb = Math.max(14, Math.min(34, Math.round(28 - Math.abs(ratingGap) * 0.45)));
  const lossProb = Math.max(8, 100 - winProb - drawProb);

  return {
    userProfile,
    oppProfile,
    attAdv,
    midAdv,
    defAdv,
    gkAdv,
    matchups,
    styleVerdict,
    warnings: warnings.slice(0, 2),
    probs: { win: winProb, draw: drawProb, loss: lossProb }
  };
}

      goals: 0,
      assists: 0,
      shots: 0,
      passes: 0,
      saves: 0,
      rating: 6.5
    };
  });

  const createEmptyStats = () => ({
    possessionTicks: 1,
    passesTotal: 0,
    passesSuccess: 0,
    throughBalls: 0,
    crosses: 0,
    shotsTotal: 0,
    shotsOnTarget: 0,

    corners: 0,
    fouls: 0,
    offsides: 0,
    yellowCards: 0,
    redCards: 0,

  });

  LIVE_MATCH = {
    seed,

    homePlayers,

  logMatchEvent(0, 'home', 'KICKOFF', 'انطلاق صافرة بداية المباراة! 90 دقيقة كروية (5 دقائق حية).', null);

function nextMatchRand() {
  LIVE_MATCH.rngState = (LIVE_MATCH.rngState * 1664525 + 1013904223) >>> 0;
  return LIVE_MATCH.rngState / 4294967296;
}

function logMatchEvent(minute, team, type, text, meta = null) {
  LIVE_MATCH.event_log.unshift({
    id: LIVE_MATCH.event_log.length + 1,
    minute: Math.min(90, Math.max(0, Math.round(minute))),
    team,
    type,
    text,
    meta
  });
}

function startMatchLoop() {
  if (MATCH_TIMER_INTERVAL) clearInterval(MATCH_TIMER_INTERVAL);
  // Tick every 250ms (4 ticks per real second -> 1200 ticks = 300 real seconds = 5 minutes!)
  MATCH_TIMER_INTERVAL = setInterval(() => {
    if (!LIVE_MATCH || LIVE_MATCH.paused || LIVE_MATCH.finished) return;
    stepMatchSimulation(0.25);
  }, 250);
}

function stepMatchSimulation(dtSeconds) {
  const m = LIVE_MATCH;
  m.elapsedRealSeconds = Math.min(m.totalRealSeconds, m.elapsedRealSeconds + dtSeconds);
  const prevMin = m.minute;
  m.minute = Math.min(90, (m.elapsedRealSeconds / m.totalRealSeconds) * 90);

  // Halftime marker at 45'
  if (prevMin < 45 && m.minute >= 45) {
    logMatchEvent(45, 'home', 'HALFTIME', `نهاية الشوط الأول: ${GAME_STATE.club.name} ${m.homeScore} - ${m.awayScore} ${m.opponent.club.name}`, null);
  }

  // Gradual stamina drain
  const drainRate = m.homePlayStyle === 'attacking' ? 0.022 : 0.015;
  m.homePlayers.forEach(p => { if (!p.redCard) p.stamina = Math.max(42, p.stamina - drainRate); });
  m.awayPlayers.forEach(p => { if (!p.redCard) p.stamina = Math.max(42, p.stamina - 0.017); });

  // Possession tick tracking (guaranteed Home + Away = 100%)
  m.stats[m.possessionTeam].possessionTicks += 1;

  // Execute step-by-step football action every ~1.25 real seconds (every 5th tick)
  const tickNumber = Math.round(m.elapsedRealSeconds * 4);
  if (tickNumber % 5 === 0) {
    executeTacticalStep();
  }

  // Smoothly animate player positions toward tactical shape + ball
  updateLivePlayerCoordinates();

  // Check Full Time at 300 real seconds (90:00)
  if (m.elapsedRealSeconds >= m.totalRealSeconds) {
    m.minute = 90;
    m.finished = true;
    clearInterval(MATCH_TIMER_INTERVAL);
    logMatchEvent(90, 'home', 'FULLTIME', `صافرة النهاية! النتيجة النهائية: ${m.homeScore} - ${m.awayScore}`, null);
    finalizeMatchAndGenerateReport();
  }

  if (GAME_STATE.activeTab === 'match') {
    updateLiveMatchUI();
  }
}

// Step-by-Step Logical Football Chain (Pass -> Dribble/Through/Cross -> Shot -> GK Save -> Goal/Corner)
function executeTacticalStep() {
  const m = LIVE_MATCH;
  const r = nextMatchRand;
  const team = m.possessionTeam;
  const oppTeam = team === 'home' ? 'away' : 'home';
  const activeSquad = (team === 'home' ? m.homePlayers : m.awayPlayers).filter(p => !p.redCard);
  const defendSquad = (oppTeam === 'home' ? m.homePlayers : m.awayPlayers).filter(p => !p.redCard);
  const atkProf = team === 'home' ? m.homeProfile : m.awayProfile;
  const defProf = oppTeam === 'home' ? m.homeProfile : m.awayProfile;
  const atkStyle = team === 'home' ? m.homePlayStyle : m.awayPlayStyle;

  if (activeSquad.length === 0 || defendSquad.length === 0) return;

  // Find current ball carrier
  let carrier = activeSquad.find(p => p.uid === m.ballOwnerUid) || activeSquad[Math.floor(r() * activeSquad.length)];
  const attackingForward = team === 'home' ? -1 : 1; // Home attacks toward y=6; Away attacks toward y=94
  const distToOppGoal = team === 'home' ? m.ballY : (100 - m.ballY);

  // Action 1: Build-up / Midfield Progression (Pass or Dribble)
  if (distToOppGoal > 34) {
    // Choose receiver ahead or sideways
    const candidates = activeSquad.filter(p => p.uid !== carrier.uid && p.zonePos !== 'GK');
    const receiver = candidates[Math.floor(r() * candidates.length)] || carrier;

    const passSkill = (carrier.attrs.passing || carrier.ovr) * carrier.fit * (carrier.stamina / 100);
    const midEdge = (atkProf.midfieldStrength - defProf.midfieldStrength) * 0.45;
    const passSuccessProb = Math.max(0.62, Math.min(0.93, 0.78 + (passSkill - 80) * 0.004 + midEdge * 0.01));

    m.stats[team].passesTotal += 1;
    carrier.passes += 1;
    m.trailX = m.ballX;
    m.trailY = m.ballY;

    if (r() < passSuccessProb) {
      // Successful pass! Advance ball toward opponent third
      m.stats[team].passesSuccess += 1;
      carrier.rating = Math.min(9.9, carrier.rating + 0.03);
      m.ballOwnerUid = receiver.uid;
      const advance = 13 + r() * 14;
      m.ballY = Math.max(10, Math.min(90, m.ballY + attackingForward * advance));
      m.ballX = Math.max(10, Math.min(90, receiver.currX + (r() - 0.5) * 14));

      // Through ball check
      if (advance > 22 && r() > 0.55) {
        m.stats[team].throughBalls += 1;
        logMatchEvent(m.minute, team, 'THROUGH_BALL', `تمريرة بينية ذكية من ${carrier.name} نحو ${receiver.name}`, { passer: carrier.name, receiver: receiver.name });
      }
    } else {
      // Interception / Turnover or Foul
      if (r() < 0.14) {
        // Foul committed by defender
        const fouler = defendSquad.filter(p => p.zonePos !== 'GK')[Math.floor(r() * Math.max(1, defendSquad.length - 1))];
        m.stats[oppTeam].fouls += 1;
        if (fouler && r() < 0.22) {
          fouler.yellowCards += 1;
          m.stats[oppTeam].yellowCards += 1;
          if (fouler.yellowCards >= 2) {
            fouler.redCard = true;
            m.stats[oppTeam].redCards += 1;
            logMatchEvent(m.minute, oppTeam, 'RED_CARD', `بطاقة حمراء! طرد ${fouler.name} بعد الإنذار الثاني!`, { player: fouler.name });
          } else {
            logMatchEvent(m.minute, oppTeam, 'YELLOW_CARD', `بطاقة صفراء على ${fouler.name} بعد تدخل قوي.`, { player: fouler.name });
          }
        }
      } else {
        // Clean turnover
        const interceptor = defendSquad[Math.floor(r() * defendSquad.length)];
        m.possessionTeam = oppTeam;
        m.ballOwnerUid = interceptor.uid;
        interceptor.rating = Math.min(9.9, interceptor.rating + 0.05);
      }
    }
    return;
  }

  // Action 2: Final Third Attack (Cross, Dribble, Offside, Penalty, or Shot Chain!)
  // Offside check
  if (r() < 0.06) {
    m.stats[team].offsides += 1;
    m.possessionTeam = oppTeam;
    m.ballOwnerUid = defendSquad[0].uid;
    logMatchEvent(m.minute, team, 'OFFSIDE', `تسلل محتسب على ${carrier.name} خلف خط الدفاع.`, { player: carrier.name });
    return;
  }

  // Flank Cross or Central Shot Preparation
  const isFlank = m.ballX < 26 || m.ballX > 74;
  let shooter = carrier;
  let assister = null;

  if (isFlank && r() < 0.62) {
    // Wing Cross into the box
    m.stats[team].crosses += 1;
    const boxTargets = activeSquad.filter(p => p.zonePos === 'ST' || p.zonePos === 'CM' || p.zonePos === 'RW' || p.zonePos === 'LW');
    shooter = boxTargets[Math.floor(r() * boxTargets.length)] || carrier;
    assister = carrier.uid !== shooter.uid ? carrier : null;
    m.trailX = m.ballX;
    m.trailY = m.ballY;
    m.ballX = 44 + r() * 12;
    m.ballY = team === 'home' ? 12 : 88;
  } else {
    // Central combination pass before shot
    const attackers = activeSquad.filter(p => p.zonePos === 'ST' || p.zonePos === 'RW' || p.zonePos === 'LW' || p.zonePos === 'CM');
    const chosen = attackers[Math.floor(r() * attackers.length)] || carrier;
    if (chosen.uid !== carrier.uid) {
      m.stats[team].passesTotal += 1;
      m.stats[team].passesSuccess += 1;
      carrier.passes += 1;
      assister = carrier;
      shooter = chosen;
    }
  }

  // Penalty Check inside box (rare, realistic)
  if (r() < 0.032) {
    m.stats[team].penalties += 1;
    const gk = defendSquad.find(p => p.zonePos === 'GK') || defendSquad[0];
    m.stats[team].shotsTotal += 1;
    m.stats[team].shotsOnTarget += 1;
    shooter.shots += 1;

    const penProb = Math.max(0.64, Math.min(0.86, 0.76 + ((shooter.attrs.finishing || shooter.ovr) - (gk.ovr || 80)) * 0.004));
    if (r() < penProb) {
      recordGoal(m, team, shooter, null, 'هدف من ركلة جزاء متقنة!');
    } else {
      gk.saves += 1;
      gk.rating = Math.min(9.9, gk.rating + 0.45);
      m.stats[oppTeam].saves += 1;
      logMatchEvent(m.minute, oppTeam, 'SAVE', `تصدٍّ أسطوري من الحارس ${gk.name} لركلة جزاء ${shooter.name}!`, { gk: gk.name, shooter: shooter.name });
      m.possessionTeam = oppTeam;
      m.ballOwnerUid = gk.uid;
    }
    return;
  }

  // SHOT EXECUTION CHAIN -> Shot -> On Target Check -> GK Save Check -> Goal / Corner / Miss
  m.stats[team].shotsTotal += 1;
  shooter.shots += 1;
  m.trailX = m.ballX;
  m.trailY = m.ballY;
  m.ballX = 46 + r() * 8;
  m.ballY = team === 'home' ? 4 : 96;

  const finishAttr = (shooter.attrs.finishing || shooter.attrs.shooting || shooter.ovr) * shooter.fit * (shooter.stamina / 100);
  const counterBonus = (atkStyle === 'attacking' && defProf.counterVulnerability > 1.1) ? 1.08 : defProf.counterVulnerability;
  const onTargetProb = Math.max(0.32, Math.min(0.68, (0.44 + (finishAttr - 78) * 0.005) * counterBonus));

  if (r() > onTargetProb) {
    // Shot off target -> Goal kick
    logMatchEvent(m.minute, team, 'SHOT_MISS', `تسديدة من ${shooter.name} تمر بجوار القائم.`, { shooter: shooter.name });
    m.possessionTeam = oppTeam;
    m.ballOwnerUid = defendSquad[0].uid;
    m.ballY = team === 'home' ? 12 : 88;
    return;
  }

  // Shot IS ON TARGET!
  m.stats[team].shotsOnTarget += 1;
  const gk = defendSquad.find(p => p.zonePos === 'GK') || defendSquad[0];
  const gkAbility = defProf.goalkeeperStrength * (gk.fit || 1);
  const atkPressure = (finishAttr * 0.65 + atkProf.attackStrength * 0.35) * counterBonus;

  // Save probability driven by real GK strength vs Shot quality
  const saveProb = Math.max(0.45, Math.min(0.86, 0.68 + (gkAbility - atkPressure) * 0.009));

  if (r() < saveProb) {
    // GK SAVES THE SHOT!
    gk.saves += 1;
    gk.rating = Math.min(9.9, gk.rating + 0.22);
    m.stats[oppTeam].saves += 1;

    if (r() < 0.35) {
      // Deflected out for a Corner Kick!
      m.stats[team].corners += 1;
      logMatchEvent(m.minute, team, 'CORNER', `الحارس ${gk.name} يبعد تسديدة ${shooter.name} إلى ركلة ركنية.`, { gk: gk.name, shooter: shooter.name });
      m.ballX = r() > 0.5 ? 95 : 5;
      m.ballY = team === 'home' ? 6 : 94;
    } else {
      logMatchEvent(m.minute, oppTeam, 'SAVE', `تصدٍّ رائع من ${gk.name} أمام تسديدة ${shooter.name}!`, { gk: gk.name, shooter: shooter.name });
      m.possessionTeam = oppTeam;
      m.ballOwnerUid = gk.uid;
      m.ballY = team === 'home' ? 10 : 90;
    }
  } else {
    // GOOOOOAL!
    const reasonTag = defProf.counterVulnerability > 1.15
      ? 'مستغلاً المساحات المكشوفة خلف خط الدفاع!'
      : (assister ? `بعد تمريرة حاسمة من ${assister.name}!` : 'بتسديدة قوية داخل الشباك!');
    recordGoal(m, team, shooter, assister, reasonTag);
  }
}

function recordGoal(m, team, scorer, assister, reasonText) {
  if (team === 'home') m.homeScore += 1;
  else m.awayScore += 1;

  m.stats[team].goals += 1;
  scorer.goals += 1;
  scorer.rating = Math.min(10.0, scorer.rating + 1.1);
  if (assister) {
    assister.assists += 1;
    assister.rating = Math.min(10.0, assister.rating + 0.6);
  }

  const teamName = team === 'home' ? GAME_STATE.club.name : m.opponent.club.name;
  logMatchEvent(
    m.minute,
    team,
    'GOAL',
    `هدف لـ ${teamName}! سجله ${scorer.name} ${reasonText}`,
    {
      scorer: scorer.name,
      scorer_uid: scorer.uid,
      assister: assister ? assister.name : null,
      assister_uid: assister ? assister.uid : null,
      score: `${m.homeScore}-${m.awayScore}`,
      reason: reasonText
    }
  );

  m.bannerAlert = {
    title: `هدف! ${teamName}`,
    sub: `${Math.round(m.minute)}' • ${scorer.name} ${assister ? `(صناعة: ${assister.name})` : ''}`,
    team
  };
  setTimeout(() => { if (LIVE_MATCH) LIVE_MATCH.bannerAlert = null; }, 3200);

  // Kickoff reset to conceding team
  m.possessionTeam = team === 'home' ? 'away' : 'home';
  const kickSquad = m.possessionTeam === 'home' ? m.homePlayers : m.awayPlayers;
  m.ballOwnerUid = kickSquad[Math.min(9, kickSquad.length - 1)].uid;
  m.ballX = 50;
  m.ballY = 50;
}

function updateLivePlayerCoordinates() {
  const m = LIVE_MATCH;
  if (!m) return;
  const ballShiftY = (m.ballY - 50) * 0.26;
  const ballShiftX = (m.ballX - 50) * 0.16;

  m.homePlayers.forEach(p => {
    if (p.redCard) return;
    if (p.zonePos === 'GK') {
      p.currX = 50 + (m.ballX - 50) * 0.12;
      p.currY = 91;
      return;
    }
    const stylePush = m.homePlayStyle === 'attacking' ? -6 : (m.homePlayStyle === 'defensive' ? 5 : 0);
    p.currX = Math.max(8, Math.min(92, p.baseX + ballShiftX));
    p.currY = Math.max(10, Math.min(84, p.baseY + ballShiftY + stylePush));
  });

  m.awayPlayers.forEach(p => {
    if (p.redCard) return;
    if (p.zonePos === 'GK') {
      p.currX = 50 + (m.ballX - 50) * 0.12;
      p.currY = 9;
      return;
    }
    const stylePush = m.awayPlayStyle === 'attacking' ? 6 : (m.awayPlayStyle === 'defensive' ? -5 : 0);
    p.currX = Math.max(8, Math.min(92, p.baseX + ballShiftX));
    p.currY = Math.max(16, Math.min(90, p.baseY + ballShiftY + stylePush));
  });
}

// Live In-Match Substitution (Without stopping match)
function executeLiveSubstitution(outUid, benchInstId) {
  const m = LIVE_MATCH;
  if (!m || m.finished) return;
  if (m.homeSubCount >= 5) {
    showToast('وصلت للحد الأقصى للتبديلات (5 تبديلات)!', 'error');
    return;
  }
  if (m.subbedOutUids.includes(benchInstId)) {
    showToast('لا يمكن إشراك لاعب تم استبداله مسبقاً في نفس المباراة!', 'error');
    return;
  }
  if (m.homePlayers.some(p => p.uid === benchInstId)) {
    showToast('هذا اللاعب موجود بالفعل في أرض الملعب!', 'error');
    return;
  }

  const slotIdx = m.homePlayers.findIndex(p => p.uid === outUid);
  if (slotIdx === -1) return;
  const outPlayer = m.homePlayers[slotIdx];
  const inData = getInstanceFullData(benchInstId);
  if (!inData) return;

  const newLivePlayer = {
    uid: benchInstId,
    player_id: inData.player.player_id,
    name: inData.player.display_name,
    pos: inData.player.primary_position,
    zonePos: outPlayer.zonePos,
    ovr: inData.ovr,
    fit: getPositionalFit(inData.player, outPlayer.zonePos),
    attrs: inData.card.attributes,
    baseX: outPlayer.baseX,
    baseY: outPlayer.baseY,
    currX: outPlayer.currX,
    currY: outPlayer.currY,
    stamina: 100,
    yellowCards: 0,
    redCard: false,
    subbedOut: false,
    goals: 0,
    assists: 0,
    shots: 0,
    passes: 0,
    saves: 0,
    rating: 6.5
  };

  m.homePlayers[slotIdx] = newLivePlayer;
  m.subbedOutUids.push(outUid);
  m.homeSubCount += 1;

  // Recalculate live tactical profile immediately
  const startersForEval = m.homePlayers.map(p => ({
    player: PLAYER_BY_ID.get(p.player_id),
    card: getInstanceFullData(p.uid)?.card || CARD_BY_ID.get(`c_${p.player_id}_std`),
    ovr: p.ovr,
    zonePos: p.zonePos
  }));
  m.homeProfile = evaluateTeamTacticalProfile(startersForEval, m.homePlayStyle, GAME_STATE.coaches);

  logMatchEvent(m.minute, 'home', 'SUB', `تبديل تكتيكي: دخول ${newLivePlayer.name} بدلاً من ${outPlayer.name}.`, { in: newLivePlayer.name, out: outPlayer.name });
  showToast(`تم التبديل: ${newLivePlayer.name} يدخل الملعب`, 'success');
  closeModal();
  updateLiveMatchUI();
}

// ============================================================================
// 6. POST-MATCH TECHNICAL ANALYST REPORT (100% DERIVED FROM EVENT LOG & STATS)
// ============================================================================
function finalizeMatchAndGenerateReport() {
  const m = LIVE_MATCH;
  const hStats = m.stats.home;
  const aStats = m.stats.away;

  // Guarantee exact 100% possession sum
  const totalPoss = hStats.possessionTicks + aStats.possessionTicks;
  const homePossPct = Math.round((hStats.possessionTicks / totalPoss) * 100);
  const awayPossPct = 100 - homePossPct;

  const homePassAcc = hStats.passesTotal > 0 ? Math.round((hStats.passesSuccess / hStats.passesTotal) * 100) : 0;
  const awayPassAcc = aStats.passesTotal > 0 ? Math.round((aStats.passesSuccess / aStats.passesTotal) * 100) : 0;

  // Persist player goals/assists & Idempotent Goal Milestone Progression (+1 every 5 goals, max +4)
  m.homePlayers.forEach(lp => {
    const owned = GAME_STATE.roster.find(r => r.card_instance_id === lp.uid);
    if (owned) {
      owned.goals_scored = (owned.goals_scored || 0) + lp.goals;
      owned.assists = (owned.assists || 0) + lp.assists;
      owned.matches_played = (owned.matches_played || 0) + 1;
      // Idempotent milestone check: floor(total_goals / 5) capped at 4
      owned.goal_bonus = Math.min(4, Math.floor(owned.goals_scored / 5));
    }
  });

  // Determine Result & Prize Money
  let outcome = 'DRAW';
  let prize = 3.5;
  if (m.homeScore > m.awayScore) {
    outcome = 'WIN';
    prize = m.opponent.tier === 'stronger' ? 12.0 : 7.5;
    GAME_STATE.achievements.first_win = true;
    if (m.awayScore === 0) GAME_STATE.achievements.clean_sheet = true;
    if (m.opponent.tier === 'stronger') GAME_STATE.achievements.tactical_master = true;
  } else if (m.homeScore < m.awayScore) {
    outcome = 'LOSS';
    prize = 1.5;
  }
  if (m.homePlayers.some(p => p.goals >= 3)) GAME_STATE.achievements.hat_trick = true;
  const totalCareerGoals = GAME_STATE.roster.reduce((s, r) => s + (r.goals_scored || 0), 0);
  if (totalCareerGoals >= 50) GAME_STATE.achievements.goals_50 = true;

  GAME_STATE.budget = Number((GAME_STATE.budget + prize).toFixed(1));
  GAME_STATE.club.round += 1;

  // Find Man of the Match from actual live ratings & goals
  const allParticipants = [...m.homePlayers, ...m.awayPlayers];
  const motm = [...allParticipants].sort((a, b) => (b.rating + b.goals * 0.8 + b.saves * 0.25) - (a.rating + a.goals * 0.8 + a.saves * 0.25))[0];

  // Build Data-Driven Technical Reasons (Why we won / drew / lost)
  const reasons = [];
  if (outcome === 'WIN') {
    if (hStats.shotsOnTarget > aStats.shotsOnTarget) {
      reasons.push(`تفوق هجومي واضح بـ ${hStats.shotsOnTarget} تسديدات مركزة على المرمى مقابل ${aStats.shotsOnTarget} للخصم.`);
    }
    if (homePassAcc >= 84) {
      reasons.push(`سيطرة في وسط الملعب بدقة تمرير بلغت ${homePassAcc}% (${hStats.passesSuccess}/${hStats.passesTotal} تمريرة ناجحة).`);
    }
    if (hStats.saves >= 3 && m.awayScore <= 1) {
      reasons.push(`تألق حارس المرمى بـ ${hStats.saves} تصديات حاسمة حافظت على تفوق الفريق.`);
    }
  } else if (outcome === 'LOSS') {
    if (m.homePlayStyle === 'attacking' && aStats.goals >= 2) {
      reasons.push(`الاندفاع الهجومي ترك مساحات مكشوفة خلف خط الدفاع استغلها الخصم لتسجيل ${aStats.goals} أهداف.`);
    }
    if (m.homeProfile.outOfPosList.length > 0) {
      reasons.push(`تأثر الانسجام بوجود ${m.homeProfile.outOfPosList.length} لاعب في مراكز غير مناسبة مما خفض كفاءة التغطية.`);
    }
    if (hStats.shotsOnTarget > hStats.goals + 2) {
      reasons.push(`إهدار الفرص: سدد فريقك ${hStats.shotsOnTarget} كرة على المرمى لكن حارس الخصم تصدى لـ ${aStats.saves} منها.`);
    }
  } else {
    reasons.push(`توازن تكتيكي متقارب: الاستحواذ (${homePossPct}% مقابل ${awayPossPct}%) والتسديدات على المرمى (${hStats.shotsOnTarget} مقابل ${aStats.shotsOnTarget}).`);
  }
  if (reasons.length === 0) {
    reasons.push(`حسمت الفعالية أمام المرمى النتيجة النهائية (${m.homeScore}-${m.awayScore}) بناءً على جودة الإنهاء والتمركز.`);
  }

  // Specialist Coach Impact Breakdown (What improved vs what stayed unchanged)
  const coachImpactReport = GAME_STATE.coaches.map(c => ({
    title: c.title_ar,
    level: c.level,
    improved: c.level > 1,
    effectText: c.level > 1
      ? `مستوى الكفاءة ${c.level}: عزز أداء قسم ${c.title_ar.replace('مدرب ', '')} بنسبة +${((c.level - 1) * 1.8).toFixed(1)}%.`
      : 'لم يتم تطويره بعد (المستوى الأساسي 1 — لا يوجد تأثير إضافي).'
  }));

  // Actionable Recommendation for Next Match
  let nextRecommendation = 'حافظ على التوازن التكتيكي الحالي وواصل تطوير مهارات المهاجمين في مركز التطوير.';
  if (m.homeProfile.outOfPosList.length > 0) {
    nextRecommendation = `أعد ${m.homeProfile.outOfPosList[0].name} إلى مركزه الأصلي (${m.homeProfile.outOfPosList[0].realPos}) لإزالة عقوبة التمركز.`;
  } else if (outcome === 'LOSS' && m.homePlayStyle === 'attacking') {
    nextRecommendation = 'جرّب التحول إلى الأسلوب المتوازن أو الدفاعي عند مواجهة خصوم يملكون أجنحة سريعة.';
  } else if (homePassAcc < 78) {
    nextRecommendation = 'خصص جلسة تدريب قادمة لـ (مدرب الوسط) لرفع دقة التمرير والاستحواذ.';
  }

  const report = {
    matchId: `match_${Date.now()}`,
    date: new Date().toLocaleString('ar-EG'),
    outcome,
    prize,
    homeClub: GAME_STATE.club.name,
    awayClub: m.opponent.club.name,
    homeScore: m.homeScore,
    awayScore: m.awayScore,
    possession: { home: homePossPct, away: awayPossPct },
    passAcc: { home: homePassAcc, away: awayPassAcc },
    stats: { home: { ...hStats }, away: { ...aStats } },
    event_log: [...m.event_log],
    homePlayers: m.homePlayers.map(p => ({ ...p })),
    awayPlayers: m.awayPlayers.map(p => ({ ...p })),
    motm: { name: motm.name, rating: motm.rating.toFixed(1), goals: motm.goals, saves: motm.saves },
    reasons,
    coachImpactReport,
    nextRecommendation
  };

  GAME_STATE.lastReport = report;
  GAME_STATE.matchHistory.unshift(report);
  // Clear locked opponent so user can scout next opponent
  GAME_STATE.currentOpponent = null;
  persistState();
}

function buyCardFromMarket(cardId) {
  const card = CARD_BY_ID.get(cardId);
  if (!card) return;
  const player = PLAYER_BY_ID.get(card.player_id);
  if (!player) return;

  if (GAME_STATE.budget < card.price) {
    showToast(`الميزانية غير كافية! تحتاج €${card.price.toFixed(1)}M`, 'error');
    return;
  }

  // Deduct budget ONCE, create unique card_instance_id, add to Club Roster immediately
  GAME_STATE.budget = Number((GAME_STATE.budget - card.price).toFixed(1));
  const instId = `inst_${player.player_id}_${Date.now()}_${Math.floor(Math.random() * 999)}`;

  GAME_STATE.roster.push({
    card_instance_id: instId,
    player_id: player.player_id,
    card_id: card.card_id,
    edition: card.edition,
    base_rating: card.base_rating,
    goal_bonus: 0,
    training_bonus: 0,
    goals_scored: 0,
    assists: 0,
    matches_played: 0,
    acquired_at: new Date().toISOString()
  });

  if (GAME_STATE.bench.length < 7) {
    GAME_STATE.bench.push(instId);
  }

  if (card.base_rating >= 100) {
    GAME_STATE.achievements.galactico_signing = true;
  }

  GAME_STATE.transferLedger.unshift({
    type: 'BUY',
    playerName: player.display_name,
    edition: card.edition,
    ovr: card.base_rating,
    amount: card.price,
    date: new Date().toLocaleTimeString('ar-EG')
  });

  persistState();
  closeModal();
  showToast(`صفقة ناجحة! تم ضم ${player.display_name} (${card.edition} ${card.base_rating}) إلى فريقك`, 'success');
  renderApp();
}

function sellOwnedInstance(instId) {
  if (LIVE_MATCH && !LIVE_MATCH.finished) {
    showToast('لا يمكن بيع لاعب أثناء خوض مباراة حية!', 'error');
    return;
  }
  if (GAME_STATE.roster.length <= 11) {
    showToast('لا يمكن بيع اللاعب: يجب الاحتفاظ بـ 11 لاعباً على الأقل في النادي!', 'error');
    return;
  }
  const idx = GAME_STATE.roster.findIndex(r => r.card_instance_id === instId);
  if (idx === -1) return;

  const inst = GAME_STATE.roster[idx];
  const player = PLAYER_BY_ID.get(inst.player_id);
  const card = CARD_BY_ID.get(inst.card_id);
  const saleValue = Number((card.price * 0.72).toFixed(1));

  // If starter, replace with a bench player first
  const lineIdx = GAME_STATE.lineup.findIndex(s => s.instance_id === instId);
  if (lineIdx !== -1) {
    const replacement = GAME_STATE.bench.find(bId => bId !== instId);
    if (!replacement) {
      showToast('قم بتبديل اللاعب من التشكيلة الأساسية أولاً قبل بيعه!', 'error');
      return;
    }
    GAME_STATE.lineup[lineIdx].instance_id = replacement;
    GAME_STATE.bench = GAME_STATE.bench.filter(bId => bId !== replacement);
  }

  GAME_STATE.bench = GAME_STATE.bench.filter(bId => bId !== instId);
  GAME_STATE.roster.splice(idx, 1);
  GAME_STATE.budget = Number((GAME_STATE.budget + saleValue).toFixed(1));

  GAME_STATE.transferLedger.unshift({
    type: 'SELL',
    playerName: player.display_name,
    edition: card.edition,
    ovr: getInstanceEffectiveOVR(inst),
    amount: saleValue,
    date: new Date().toLocaleTimeString('ar-EG')
  });

  persistState();
  showToast(`تم بيع ${player.display_name} مقابل +€${saleValue}M`, 'info');
  renderApp();
}

// Specialist Coaching Session (Strictly 2 specialists selected out of 4)
let selectedCoachIds = [];
let sessionLock = false;

function toggleCoachSelection(coachId) {
  if (selectedCoachIds.includes(coachId)) {
    selectedCoachIds = selectedCoachIds.filter(id => id !== coachId);
  } else {
    if (selectedCoachIds.length >= 2) {
      showToast('يُسمح باختيار مدربين اثنين (2) فقط في الجلسة الواحدة!', 'error');
      return;
    }
    selectedCoachIds.push(coachId);
  }
  openCoachTrainingModal();
}

function confirmCoachTrainingSession() {
  if (sessionLock) return;
  if (selectedCoachIds.length !== 2) {
    showToast('يجب اختيار تخصصين (2) بالضبط لتأكيد الجلسة التدريبية!', 'error');
    return;
  }
  const sessionCost = 2.0;
  if (GAME_STATE.budget < sessionCost) {
    showToast('الميزانية غير كافية لتكلفة الجلسة التدريبية (€2.0M)!', 'error');
    return;
  }

  sessionLock = true;
  GAME_STATE.budget = Number((GAME_STATE.budget - sessionCost).toFixed(1));
  GAME_STATE.trainingSessionCounter += 1;
  const sessionId = `sess_${GAME_STATE.trainingSessionCounter}_${Date.now()}`;
  const nowStr = new Date().toLocaleString('ar-EG');

  // Increment efficiency/level ONLY for the 2 chosen coaches
  GAME_STATE.coaches.forEach(coach => {
    if (selectedCoachIds.includes(coach.coach_id)) {
      coach.level += 1;
      coach.xp += 100;
      coach.logs.unshift({ sessionId, date: nowStr, gain: '+1 كفاءة' });
    }
  });

  selectedCoachIds = [];
  persistState();
  closeModal();
  showToast('تم إكمال الجلسة التدريبية ورفع كفاءة المدربين المختارين (+1)!', 'success');
  renderApp();
  setTimeout(() => { sessionLock = false; }, 400);
}

// Separate Player Development Center Upgrade (Up to +10 Special Training OVR)
function upgradePlayerSpecialTraining(instId) {
  const inst = GAME_STATE.roster.find(r => r.card_instance_id === instId);
  if (!inst) return;
  if ((inst.training_bonus || 0) >= 10) {
    showToast('وصل اللاعب للحد الأقصى للتدريب الخاص (+10 OVR)!', 'info');
    return;
  }
  const cost = Number((2.5 + (inst.training_bonus || 0) * 1.2).toFixed(1));
  if (GAME_STATE.budget < cost) {
    showToast(`الميزانية غير كافية! تكلفة التطوير €${cost}M`, 'error');
    return;
  }
  GAME_STATE.budget = Number((GAME_STATE.budget - cost).toFixed(1));
  inst.training_bonus = (inst.training_bonus || 0) + 1;
  persistState();
  showToast(`تم تطوير قدرات اللاعب! التقييم الجديد: ${getInstanceEffectiveOVR(inst)} OVR`, 'success');
  renderApp();
}

    info: 'bg-slate-800 text-white border-cyan-400'

  const div = document.createElement('div');
  div.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-bold animate-slide-up flex items-center justify-between gap-2 ${colors[type] || colors.info}`;
  div.innerHTML = `<span>${msg}</span>`;
  container.appendChild(div);
  setTimeout(() => {
    div.style.opacity = '0';
    div.style.transition = 'opacity 0.25s';
    setTimeout(() => div.remove(), 260);
  }, 3200);
}

function buildRadialMeterSVG(label, val, maxVal, color, suffix = '') {
  const pct = Math.min(1, Math.max(0, val / maxVal));
  const r = 34;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct);
  return `
    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-3 flex flex-col items-center justify-center text-center">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="7"/>
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="7"
          stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
          transform="rotate(-90 42 42)"/>
        <text x="42" y="46" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="900">${val}${suffix}</text>
      </svg>
      <span class="text-[11px] font-extrabold text-slate-300 mt-1">${label}</span>
    </div>
  `;
}

function initFreePitchDragAndDrop() {
  const board = document.getElementById('tactical-pitch-board');
  if (!board) return;

  let activeToken = null;
  let activeIdx = null;
  let startX = 0, startY = 0;
  let moved = false;

  const getCoords = (e) => {
    if (e.touches && e.touches.length > 0) return { cx: e.touches[0].clientX, cy: e.touches[0].clientY };
    return { cx: e.clientX, cy: e.clientY };
  };

  const onDown = (e) => {
    const token = e.target.closest('.pitch-token');
    if (!token) return;
    activeToken = token;
    activeIdx = Number(token.dataset.slotIdx);
    const { cx, cy } = getCoords(e);
    startX = cx;
    startY = cy;
    moved = false;
    token.classList.add('dragging');
  };

  const onMove = (e) => {
    if (!activeToken) return;
    const { cx, cy } = getCoords(e);
    if (Math.abs(cx - startX) > 4 || Math.abs(cy - startY) > 4) moved = true;
    if (!moved) return;
    e.preventDefault();

    const rect = board.getBoundingClientRect();
    const pctX = Math.max(8, Math.min(92, ((cx - rect.left) / rect.width) * 100));
    const pctY = Math.max(8, Math.min(92, ((cy - rect.top) / rect.height) * 100));

    activeToken.style.left = `${pctX}%`;
    activeToken.style.top = `${pctY}%`;
    GAME_STATE.lineup[activeIdx].x = Number(pctX.toFixed(1));
    GAME_STATE.lineup[activeIdx].y = Number(pctY.toFixed(1));
  };

  const onUp = () => {
    if (!activeToken) return;
    activeToken.classList.remove('dragging');
    if (!moved) {
      // Tap interaction: toggle selection or swap two starters
      if (selectedStarterSlotIdx === null) {
        selectedStarterSlotIdx = activeIdx;
      } else if (selectedStarterSlotIdx === activeIdx) {
        selectedStarterSlotIdx = null;
      } else {
        // Swap the two starters' instance_ids
        const tmp = GAME_STATE.lineup[selectedStarterSlotIdx].instance_id;
        GAME_STATE.lineup[selectedStarterSlotIdx].instance_id = GAME_STATE.lineup[activeIdx].instance_id;
        GAME_STATE.lineup[activeIdx].instance_id = tmp;
        selectedStarterSlotIdx = null;
        showToast('تم تبديل مركزي اللاعبين في الملعب!', 'info');
      }
    }
    activeToken = null;
    persistState();
    renderApp();
  };

  board.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  board.addEventListener('touchstart', onDown, { passive: false });
  board.addEventListener('touchmove', onMove, { passive: false });
  board.addEventListener('touchend', onUp);
}

function handleBenchTap(benchInstId) {
  if (selectedStarterSlotIdx === null) {
    showToast('انقر أولاً على لاعب أساسي في الملعب ثم انقر على البديل لاستبداله!', 'info');
    return;
  }
  const starterInstId = GAME_STATE.lineup[selectedStarterSlotIdx].instance_id;
  const bIdx = GAME_STATE.bench.indexOf(benchInstId);
  if (bIdx === -1) return;

  GAME_STATE.lineup[selectedStarterSlotIdx].instance_id = benchInstId;
  GAME_STATE.bench[bIdx] = starterInstId;
  selectedStarterSlotIdx = null;
  persistState();
  showToast('تم التبديل بين الأساسي والبديل بنجاح!', 'success');
  renderApp();
}

function moveReserveToBench(instId) {
  if (GAME_STATE.bench.length >= 7) {
    // Swap with last bench player
    GAME_STATE.bench[6] = instId;
  } else {
    GAME_STATE.bench.push(instId);
  }
  persistState();
  showToast('تم نقل اللاعب إلى دكة البدلاء', 'success');
  renderApp();
}

function applyPresetFormation(fKey) {
  const slots = FORMATIONS[fKey];
  if (!slots) return;
  GAME_STATE.lineup.forEach((item, i) => {
    if (slots[i]) {
      item.x = slots[i].x;
      item.y = slots[i].y;
      item.expected_pos = slots[i].pos;
    }
  });
  persistState();
  showToast(`تم تطبيق التوزيع التكتيكي ${fKey}`, 'info');
  renderApp();
}

function renderMarketView(container) {
  // Build flat list of all card editions from our 1,000-player catalog
  let allCards = [];
  for (const p of PLAYER_CATALOG) {
    for (const ed of p.editions) {
      allCards.push({ player: p, card: ed });
    }
  }

  // Apply Filters
  if (marketFilter.search.trim()) {
    const q = marketFilter.search.trim().toLowerCase();
    allCards = allCards.filter(item =>
      item.player.display_name.toLowerCase().includes(q) ||
      item.player.en_name.toLowerCase().includes(q) ||
      item.player.real_club.toLowerCase().includes(q) ||
      item.player.nationality.toLowerCase().includes(q)
    );
  }
  if (marketFilter.pos !== 'ALL') {
    allCards = allCards.filter(item => item.player.primary_position === marketFilter.pos);
  }
  if (marketFilter.edition !== 'ALL') {
    allCards = allCards.filter(item => item.card.edition === marketFilter.edition);
  }

  // Sort
  allCards.sort((a, b) => {
    if (marketFilter.sort === 'ovr_desc') return b.card.base_rating - a.card.base_rating;
    if (marketFilter.sort === 'price_asc') return a.card.price - b.card.price;
    if (marketFilter.sort === 'price_desc') return b.card.price - a.card.price;
    return a.player.player_id - b.player.player_id;
  });

  const perPage = 24;
  const totalPages = Math.max(1, Math.ceil(allCards.length / perPage));
  if (marketFilter.page > totalPages) marketFilter.page = 1;
  const pageItems = allCards.slice((marketFilter.page - 1) * perPage, marketFilter.page * perPage);

      <!-- CARDS GRID -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
        ${pageItems.map(({ player, card }) => {
          const edStyle = card.edition === 'ICON' ? 'card-icon' : (card.edition === 'PRO' ? 'card-pro' : 'card-standard');

function updateLiveMatchUI() {
  const m = LIVE_MATCH;
  if (!m) return;
  if (m.finished) {
    renderApp();
    return;
  }

  const minEl = document.getElementById('live-match-minute');
  if (!minEl) return;

  const mins = Math.floor(m.minute);
  const secs = Math.floor((m.minute - mins) * 60);
  minEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}'`;

  const remSec = Math.max(0, Math.ceil(m.totalRealSeconds - m.elapsedRealSeconds));
  const remM = Math.floor(remSec / 60);
  const remS = remSec % 60;
  document.getElementById('live-real-remaining').textContent = `(${String(remM).padStart(2, '0')}:${String(remS).padStart(2, '0')} متبقية)`;

  document.getElementById('live-home-score').textContent = m.homeScore;
  document.getElementById('live-away-score').textContent = m.awayScore;

  // Ball & Pass Vector
  const ballDot = document.getElementById('live-ball-dot');
  const vec = document.getElementById('live-ball-vector');
  if (ballDot) {
    ballDot.style.left = `${m.ballX}%`;
    ballDot.style.top = `${m.ballY}%`;
  }
  if (vec) {
    vec.setAttribute('x1', m.trailX);
    vec.setAttribute('y1', m.trailY);
    vec.setAttribute('x2', m.ballX);
    vec.setAttribute('y2', m.ballY);
  }

  // Render Moving Player Tokens
  const layer = document.getElementById('live-players-layer');
  if (layer) {
    const homeHTML = m.homePlayers.filter(p => !p.redCard).map(p => `
      <div style="left:${p.currX}%; top:${p.currY}%; transform:translate(-50%,-50%);"
        class="absolute transition-all duration-300 flex flex-col items-center z-20">
        <div class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white text-slate-950 text-[9px] font-black flex items-center justify-center shadow">
          ${p.zonePos}
        </div>
        <span class="px-1 rounded bg-black/65 text-[8px] font-bold text-white whitespace-nowrap">${p.name.split(' ')[0]}</span>
      </div>
    `).join('');

    const awayHTML = m.awayPlayers.filter(p => !p.redCard).map(p => `
      <div style="left:${p.currX}%; top:${p.currY}%; transform:translate(-50%,-50%);"
        class="absolute transition-all duration-300 flex flex-col items-center z-10">
        <div class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white text-white text-[9px] font-black flex items-center justify-center shadow">
          ${p.zonePos}
        </div>
        <span class="px-1 rounded bg-black/65 text-[8px] font-bold text-rose-200 whitespace-nowrap">${p.name.split(' ')[0]}</span>
      </div>
    `).join('');

    layer.innerHTML = homeHTML + awayHTML;
  }

  // Goal Overlay Alert
  const goalOverlay = document.getElementById('live-goal-overlay');
  if (goalOverlay) {
    if (m.bannerAlert) {
      goalOverlay.classList.remove('hidden');
      goalOverlay.classList.add('flex');
      goalOverlay.innerHTML = `
        <div class="animate-goal-banner px-6 py-4 rounded-3xl bg-gradient-to-l from-amber-500 to-emerald-500 text-slate-950 text-center shadow-2xl border-2 border-white">
          <div class="text-2xl font-black">${m.bannerAlert.title}</div>
          <div class="text-xs font-extrabold mt-1">${m.bannerAlert.sub}</div>
        </div>
      `;
    } else {
      goalOverlay.classList.add('hidden');
      goalOverlay.classList.remove('flex');
    }
  }

  // Carrier label
  const carrier = [...m.homePlayers, ...m.awayPlayers].find(p => p.uid === m.ballOwnerUid);
  const carrierEl = document.getElementById('live-possession-carrier');
  if (carrierEl && carrier) {
    carrierEl.textContent = `الاستحواذ مع: ${carrier.name} (${m.possessionTeam === 'home' ? GAME_STATE.club.name : m.opponent.club.name})`;
  }

  // Event Log Feed
  const feedEl = document.getElementById('live-events-feed');
  if (feedEl) {
    feedEl.innerHTML = m.event_log.slice(0, 25).map(ev => {
      const badge = ev.type === 'GOAL' ? 'bg-emerald-500 text-slate-950' :
                    (ev.type === 'YELLOW_CARD' ? 'bg-amber-400 text-slate-950' :
                    (ev.type === 'RED_CARD' ? 'bg-rose-600 text-white' : 'bg-slate-700 text-slate-200'));
      return `
        <div class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 flex items-start gap-2">
          <span class="px-1.5 py-0.5 rounded font-black text-[10px] shrink-0 ${badge}">${ev.minute}'</span>
          <span class="leading-snug">${ev.text}</span>
        </div>
      `;
    }).join('');
  }

  // Derived Live Statistics Board
  const h = m.stats.home;
  const a = m.stats.away;
  const totPoss = h.possessionTicks + a.possessionTicks;
  const hPoss = Math.round((h.possessionTicks / totPoss) * 100);
  const aPoss = 100 - hPoss;
  const hAcc = h.passesTotal > 0 ? Math.round((h.passesSuccess / h.passesTotal) * 100) : 100;
  const aAcc = a.passesTotal > 0 ? Math.round((a.passesSuccess / a.passesTotal) * 100) : 100;

  const statRows = [
    { label: 'الاستحواذ %', hv: `${hPoss}%`, av: `${aPoss}%` },
    { label: 'التمريرات (ناجحة/إجمالي)', hv: `${h.passesSuccess}/${h.passesTotal} (${hAcc}%)`, av: `${a.passesSuccess}/${a.passesTotal} (${aAcc}%)` },
    { label: 'البينيات / العرضيات', hv: `${h.throughBalls} / ${h.crosses}`, av: `${a.throughBalls} / ${a.crosses}` },
    { label: 'التسديدات (على المرمى)', hv: `${h.shotsTotal} (${h.shotsOnTarget})`, av: `${a.shotsTotal} (${a.shotsOnTarget})` },
    { label: 'تصديات الحارس / الركنيات', hv: `${h.saves} / ${h.corners}`, av: `${a.saves} / ${a.corners}` },
    { label: 'الأخطاء / التسلل', hv: `${h.fouls} / ${h.offsides}`, av: `${a.fouls} / ${a.offsides}` },
    { label: 'البطاقات (صفراء/حمراء)', hv: `${h.yellowCards} / ${h.redCards}`, av: `${a.yellowCards} / ${a.redCards}` }
  ];

  const statsEl = document.getElementById('live-stats-board');
  if (statsEl) {
    statsEl.innerHTML = statRows.map(r => `
      <div class="flex items-center justify-between py-1 border-b border-slate-200/60 dark:border-slate-800 last:border-0">
        <span class="font-black text-emerald-400">${r.hv}</span>
        <span class="text-slate-400 font-bold text-[11px]">${r.label}</span>
        <span class="font-black text-rose-400">${r.av}</span>
      </div>
    `).join('');
  }
}

    { key: 'galactico_signing', title: 'صفقة غالاكتيكوس', desc: 'تعاقد مع بطاقة PRO أو ICON بتقييم 100+' },
    { key: 'tactical_master', title: 'عبقري التكتيك', desc: 'اهزم خصماً أقوى منك بـ +15 OVR' },

  container.innerHTML = `
    <div class="space-y-4 animate-slide-up">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <!-- Club Settings & JSON Export/Import (6 Cols) -->
        <div class="lg:col-span-6 rounded-3xl bg-white dark:bg-[#0f172a] border border-slate-200 dark:border-slate-800 p-5 shadow-lg space-y-4">
          <h3 class="text-base font-black text-emerald-400">هوية النادي والنسخ الاحتياطي (JSON / IndexedDB)</h3>
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-400">اسم النادي:</label>
            <div class="flex gap-2">

              استيراد ملف حفظ (JSON)
              <input type="file" accept=".json" class="hidden" onchange="importSaveJSON(event)" />

          <!-- Achievements -->

                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>

        <!-- Match History & Transfer Ledger (6 Cols) -->

                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function exportSaveJSON() {
  const blob = new Blob([JSON.stringify(GAME_STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `UFM_V2_Save_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('تم تصدير ملف الحفظ بنجاح!', 'success');
}

function importSaveJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && Array.isArray(parsed.roster) && parsed.roster.length > 0) {
        GAME_STATE = { ...GAME_STATE, ...parsed };
        persistState();
        showToast('تم استيراد البيانات واستعادتها بنجاح!', 'success');
        renderApp();
      } else {
        showToast('ملف JSON غير صالح!', 'error');
      }
    } catch (err) {
      showToast('حدث خطأ أثناء قراءة ملف الحفظ!', 'error');
    }
  };
  reader.readAsText(file);
}

// ============================================================================
// 9. BOOTSTRAP & SELF-VERIFICATION ON LOAD
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
  loadSavedState(() => {
    if (GAME_STATE.theme === 'light') {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }
    if (!GAME_STATE.currentOpponent) {
      generateOpponentClub();
    }
    renderApp();
  });
});
</script>
